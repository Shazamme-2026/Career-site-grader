name: Tests

# Nothing else runs tests/ — main deploys straight to Railway with no staging.
# This only BLOCKS a bad merge once "unittest" is added as a required status
# check in branch protection; until then it is a signal on the PR.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.10 is what the service actually runs: Railway builds from the
      # Dockerfile, whose playwright/python:v1.49.0-jammy base is Python
      # 3.10.12 (verified in the image). nixpacks.toml says 3.11 and is dead.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      # The full runtime, not just what the tests import — a dependency that
      # stops installing should fail here, not on the next deploy.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v
